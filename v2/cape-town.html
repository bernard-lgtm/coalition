/* DM Custom headline font, bundled with the embeds in fonts/ */

/* Cape Town v5 (from Johannesburg v25): v25's look and motion, drawn for Cape Town. The headline asks Who can build a coalition in Cape Town?, the board holds the council's 231 seats with 116 for a majority, and the party rows are DA, PA, Other, EFF and ANC. The Social Research Foundation/The Common Sense poll did not cover Cape Town, so there are two poll tabs, Ipsos and News24/SABI, each taking half the width. About this poll gives each poll's Cape Town sample and margin of error. Everything else is v25 as it stands. */
/* v25: v24 with a minus and a plus on the Other row, so a coalition can take any number of Other's seats, from none of them to all of them (35 in the Ipsos poll, 24 and 48 in the others). The two round buttons, white and ringed in black like the box, sit between Other's dotted leader and its count. A click takes one of Other's seats out of the coalition or adds one, Enter or Space does the same from the keyboard, and held down they keep going, slowly at first and then faster and faster, until they are let go, the pointer slides off them, or Other is all out or all in; each button greys out at its end. The count beside them reads the seats in the coalition over Other's total, 12/35 say, the total smaller and in warm grey as in the tally (35/35 while the intro shows every seat), and the row's pegs agree: as many stand as are in, and the rest lie flat and faded. Other's first seat goes on the end of the coalition's stack and the rest join it there, so on the half circle each press raises or sinks the peg at the coalition's end (or, where Other sits mid-stack, moves the parties after it along by a seat). A click on Other's name, pegs or count still takes all of Other in, or all of it out, and while any of it is in, the count turns into v24's X under a mouse pointer; over the minus and plus the count stays a number. Switching polls keeps a part of Other at the same count, no more than the new poll's Other holds, and all of Other stays all of it (before, Other always took the new poll's whole share). */
/* v24: v21 made light enough to run smoothly on a phone, with the same look and the same motion. In v21 every peg was built from page elements: four for each seat on the half circle (its hole, foot, side and top, with its shadow on top of that) and one for each seat in the party rows, about 1,350 elements in all, each running springs of its own. Several of those springs moved custom properties that a browser can only work out on the main thread, so a click restyled and repainted hundreds of elements on every frame of the wave, and once a coalition held a majority the hop (While it holds) kept the whole board doing that for as long as it held. Now the half circle is one canvas and each party row's pegs another, and the script draws them (PegPainter): every seat's shadow, hole, foot, side, top and outline is drawn from the same measures, colours and tweaks as v21's CSS, and moves on the same springs (the Pop and Settle curves, from the same stops), the same wave and eases, the same 120ms colour fades and the same hop, so nothing looks or moves differently. The canvases are drawn only while something is moving, rest once it has settled, and stop while the embed is scrolled out of view, picking up where they were when it comes back; every peg is drawn as an exact shape at the screen's own pixels, one for one (twice them on a 1x screen), so the pegs are as crisp as v21's. With the pegs off the page, a tap now redraws a handful of buttons rather than every peg. A mouse over a seat still names its party, through the chart's title. Archivo now loads only the cuts the embed uses (semi-condensed Bold, and regular-width Medium for the Not reported note) instead of the whole variable font, so a phone has less to download before the tabs and the flag can draw. The notes for v10 to v21 below still describe how the pegs look and move; what they say of the pegs' CSS is now the drawing code in the script. Revised: the i now sits in the box's top left-hand corner, and its old place in the top right-hand corner holds a refresh button, a black refresh arrow on a white disc that turns light grey under a mouse pointer, which takes every party out at once (Other too) and ends the intro if it is still running, so the board sinks back empty in the usual wave, the tally drops to 0 and the reader can start again. And under a mouse pointer a picked party's seat count turns into an X, to show that a click takes the party out; the number comes back when the pointer leaves. Keyboard focus shows the X too; touch screens, which have no hover, keep the number. */
/* v21: v20 with a divider under the half circle and the tally rising in after the intro. A 1px black rule now runs across the box under the half circle, with 12px clear above and below it, so the chart and the party rows read as two parts of the box. While the intro holds the full board, the tally (0/136) is out of sight; as the board drains, it rises up into place from behind a mask the size of its own line, easing out over the Wave time after a short wait, so the count arrives as the seats clear. Switching polls with nothing picked replays the intro and the rise; with the Intro tweak Off, or for readers who ask for reduced motion, the tally simply stands in place. */
/* v20: v19 with the party labels' states split between hover and pick. At rest a label is plain text, as in v19. Under a mouse pointer an unpicked label's white button pops up, raised on the pegs' pop spring with its hairline edge and soft drop shadow, the way v19's picked button did, and sinks back to plain text when the pointer leaves. Picked, the button turns black (the poll tabs' #181818) with white letters and stays raised, shadow and all, for as long as the party is in the coalition; left out, it drops back flat and the letters go back to ink (to the white button, if the pointer is still on it). Phones and other touch screens have no hover, so a tap goes straight to the black button. A press still dips the button at once, and the fill changes in .15s so a click turns it black straight away. In the intro every label starts as a raised black button and drops back to plain text as the drain's wave reaches its party. Revised: the labels are set in Geist Regular (400) rather than Bold, and their size, weight, letter-spacing and line height are tweaks under Labels (Label size, Label weight, Letter spacing, Line height); the labels are one line each, so the line height sets how tall the button is around them. Geist now loads as its variable font, so any weight from 100 to 900 draws true. */
/* v19: v18 with the party logos taken back out. Each party row now starts with the party's initials, DA, EFF, MK and ANC, set in Geist Bold in ink (ActionSA, which has no initials, keeps its name, and Other stays Other), as plain text on the page. Picked, a party's label turns into a white button (revised: at first the letters themselves popped up and cast the shadow): a white key the width of the column, with 6px corners and the letters in it, rises a little (4px, the Label pop tweak) and swells a touch on the same spring the pegs stand up on, with a faint hairline round its edge and a soft drop shadow falling straight down the page, the way the pegs' shadows fall; left out, it settles back flat with the pegs' smaller bounce, its fill, edge and shadow fade, and the label is plain text again. The labels draw 17px at every width (revised: from 26px, and 22px on phones, then 14px); the size and letter-spacing are set on each row's mark, so the properties panel can change them, the button's height follows the size, and a label too long for its button draws just small enough to fit it, as ActionSA does on phones. The Label size, Label pop and Label shadow tweaks set them; a press still dips the label at once, and under a mouse pointer an unpicked label lifts by a pixel. Also revised: the About this poll panel closes on any click or tap that isn't on the i or on one of the panel's links, or when the reader clicks away from the embed, and the i, moved down into the box's top right-hand corner, is pinned to the box's right edge so it stays in that corner at every width. */
/* v18: v17 with the party logos in place of the names. Each party row now starts with the party's logo, standing on the page with no button around it (Other, which has no logo, keeps its name, set in DM Custom in warm grey). Picked, a logo pops up: it rises 4px (the Pop tweak) and swells a touch on the same spring the pegs stand up on, and casts a soft drop shadow straight down the page, the way the pegs' shadows fall, so it reads as a cut-out lifted off the paper; left out, it settles back flat with the pegs' smaller bounce and its shadow fades. The shadow follows each logo's own outline. Logos draw 42px tall (52px on phones, where the rows are taller and the logo column grows from 68px to 76px), or less where a row is too short, and each is drawn at its optical size: the tall DA and ANC marks take the full height and the wide EFF and ActionSA ones draw smaller, so no logo outweighs its neighbours. The Logo size tweak scales them all. A press dips the logo at once, and under a mouse pointer a logo lifts by a pixel. Revised: the logos' shadows and then the pegs' shadows are lighter and soft-edged, and the sun stands higher over the board (75° up, from about 68°), so the pegs' shadows fall shorter; the Shadow tweaks (under Logos and under Pegs) and the Sun angle tweak set them. */
/* v17: v16 turned back over inside the box: the half circle now sits at the top, under the tab rule, with the party rows below it. The box's top padding drops from 46px to 8px (the i button now sits above the tabs, so there is nothing to clear), and the chart keeps its 40px band above the half circle so the Majority flag still has room. The half circle takes the box's full width wherever the height allows. On desktop the rows keep their 58px and the half circle gives way, drawing a little narrower than the box, as before. On phones the width holds the half circle back, so the party rows now take all the height it leaves: the six rows share that height evenly, and their pegs grow to fill it. How many rows of pegs each party gets, and so how many columns, is picked by the script for the room the rows actually have (it tries every count and keeps the one that gives the biggest pegs; on a 358px phone that is seven rows of 17 columns of 7px pegs, up from five rows of 23 columns of 5px), and the CSS then sets the biggest whole-pixel peg that fits both across a row and down it, so a peg never outgrows its row whatever the title, fonts or screen do. */
/* v16: v15 made lighter so clicks land at once, with the same look. The cast shadows are drawn by the pegs themselves (each peg's ::after, sitting under every peg), so the board has 270 fewer elements to redraw on every click and 270 fewer hop animations. The majority hop runs as a short burst, about two seconds after the wave crosses the dashed line, and then settles, instead of looping for as long as the majority holds, which kept the whole board busy on every frame; the Hop length tweak's While it holds brings back v12's loop. The hop's swell is set on the coalition's pegs rather than on the whole box, so it no longer restyles the party rows and everything else on every frame. The row pegs take their colour from their row and draw their side and outline in four layers instead of six. A press shows straight away, before the board redraws: a party button dips and a poll tab darkens under the finger, and taps skip the browser's double-tap wait. Each peg's place on the board and its hop timing are worked out once, not on every click. */
/* v15: v14 with an intro that shows how the embed works. The board opens full and standing still: every party's seats up in party colours, stacked round the half circle in the order of the party rows (largest first, Other last), with every party row lit and its button lifted, as though every party had been picked. Once half the chart is on screen it holds for the Hold time tweak (1s by default), then drains: the seats sink in a wave that runs from the right end back round to the left, the way they go when parties are taken out, and each row drains from its right and drops its button flat as the wave first reaches its party's seats, so the rows empty from the bottom up. Nothing animates in and nothing hops. Then it all sits empty and waits for a click. The tally stays at 0 and the Majority flag stays down throughout, since nothing has been picked. A click on a party at any point ends the intro, and the reader's own coalition takes over from whatever is standing; switching polls with nothing picked shows that poll's full board at once, standing still, and drains it the same way (with parties picked they carry over as in v12, and nothing replays). The Intro tweak runs it on view and on poll switches (the default), on view only, or never; readers who ask for reduced motion get v14's empty board. */
/* v14: v13 with the coalition stacking in the order you pick it, and a quicker, eased wave. Parties no longer slot into a fixed order with the DA always first from the left: the first party you pick takes the seats from the left end, and each party you add stacks on after the coalition already standing, so only the open seats it fills rise, in a sweep from the end of the coalition round to the new end, and nothing already standing changes colour. Take a party out and its seats sink back from the right; if it sat in the middle of the stack, the parties picked after it close the gap. Other stacks wherever it was picked too. The wave is quicker (a sweep round the whole half circle now takes 600ms, down from 800ms) and eased: the Wave ease tweak sets how each sweep gathers pace and slows, and by default it starts and ends gently (cubic-bezier(.65, 0, .35, 1)), with options for a gentle start only, a gentle end only, or v13's even pace. The party rows run on the same ease, so a party's bar still fills in step with its seats on the arc. */
/* v13: v12 with the pegs moving in waves instead of all at once. Pick a party and the pegs in its row rise column by column from the left, while its seats on the half circle rise in a sweep that runs clockwise from the left end, up over the top and round to the right. Leave a party out and it all runs the other way: its row sinks back from the right, and its seats on the half circle sink in a sweep that runs counter-clockwise, back towards the left end. Each sweep starts at the first peg that changes, so adding a party sweeps across that party's seats only, with no wait for the wave to travel round from the left end of the board. Pegs that only change colour (when a party is pushed along the arc by one ordered ahead of it) fade over in the same sweep, and every peg's top, side, outline and hole now change colour when the wave reaches it rather than on the click. A sweep round the whole half circle takes the Wave time tweak (800ms by default; 0 brings back the old all-at-once pop), and the rows run at the same pace per seat, so a party's bar fills in step with its seats on the arc. When a click wins or loses the majority, the Majority flag waits for the sweep to cross the dashed line before it rises or drops, and on a win the board starts hopping at that moment too. */
/* v12: v11 with the picked parties kept when you switch polls. Pick DA and ANC, say, then flick between the poll tabs: the same parties stay picked and the board, rows and tally redraw with that poll's seats (the rows still re-sort by size). "Other", if picked, stays picked and takes the new poll's whole Other share. A party a poll does not report separately drops out of the selection for that poll only. The party rows also get more room: 12px of padding each side (8px on phones), wider gaps between the dots (3.5px, up from 2px; 2px on phones, up from 1.5px) and one more row of dots per party (four, or five on phones), so each bar is shorter and taller. Each party row grows from 46px to 58px (48px to 52px on phones) and the half circle takes whatever height is left, so it draws a little smaller. Once the parties picked hold a majority, the coalition's pegs hop in their holes, each on a loop of its own, so the board bubbles with activity; when the coalition drops below the majority again they settle back into their seats (the Hop height and Hop speed tweaks, under Majority). The pegs in the party rows are now exact circles of one size, stand well out of the ground while their party is picked (1.8 times their width, up from 0.72), and hold still at that height; only the half circle hops. */
/* v11: v10's peg board drawn with flat toon shading instead of a photographic finish. Every peg is three flat pieces: a round top in the party colour, a side in one flat, darker tone of that colour, and a hairline outline in a deep shade of the same colour (the outlines tweak switches to black ink or to no lines). The light sits high at twelve o'clock, behind the board, so each picked peg casts a short, flat, pale shadow straight down the screen towards the reader; the holes are a flat dark tone. Nothing is blurred, blended or clipped, and every movement is a plain move or stretch, so the board stays light to draw. Same layout, springs and Majority pin as v10, but the camera looks down at 80 degrees (the cameraAngle tweak; 90 is straight down), nearly from above with just a little of each peg's side showing. Before anything is picked every peg sits just below the board's surface (and the party rows' pegs lie flush); clicking a party makes its pegs pop up, while the rest stay sunk. Empty, sunk pegs are almost white, with a fainter hairline and the faintest hole, so they all but disappear into the page and only the picked pegs carry strong colour, outlines and dark sockets. */
/* v10: v9 with every round made physical. The seat chart is a white board of pegs seen from a camera tipped back 40 degrees, so each seat shows its round top, its side and its shadow (the cameraTilt tweak sets the angle; pegHeight scales how far the pegs travel). Before anything is picked every peg stands a little proud of its hole in tan. Picked parties' pegs pop up in party colours the moment you click, overshoot a touch and wiggle once into place, and every other peg sinks into its hole in pale tan with a smaller bounce; the party buttons and the Majority flag move on the same springs. The dots in the party rows are the same pegs in miniature: they stand taller while their party is picked and sink flush when it is left out. The Majority flag now stands on a pin pushed into the far end of the dashed line. */
/* v9: v8 turned over inside the box: the party stack now sits at the top, under the tab rule, with the half-circle seat chart below it. The box's top padding grows from 30px to 46px so the first row clears the i button, and the chart keeps a 40px band above the half circle so the Majority flag always has room without touching the stack. Each party button can also carry the party's logo (LOGOS in the script): a party with a logo shows it in place of its name, and parties without one keep their names. */
/* v8: v7 with rounder party buttons (6px corners, up from 3px) and each party's name centred in its button, and a bigger Majority flag (13px type, up from 10.5px; 11.5px on phones) with 5px corners that shows only while the parties picked hold a majority. The flag fades and rises in place rather than leaving the layout, so nothing moves and the embed keeps its fixed height. */
/* v7: v6 with the seat chart and the party rows inside a box that hangs from the poll tab rule (the 3px rule is its top edge; its sides and bottom are a thinner 1.5px black, with square corners at the top and 8px rounded corners at the bottom; the first and last poll tabs round their outer top corners to match, and every other corner is square), a black button with a white letter i in place of the eye, and no divider lines between the party rows. The i is DM Custom's own glyph drawn as a shape with its ink box centred on the button, so it sits dead centre whatever font metrics the browser uses. DM Custom carries the headlines, the party names and the i (ActionSA fits at 20px, 16.5px on phones), Archivo the small capital labels, and Geist every number. Party colours are data and stay as they are. */
body{margin:0;background:#ffffff}
a{color:#a61212}a:hover{color:#171717}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #d33d3d;outline-offset:-2px}
.e-eye:focus-visible,.e-reset:focus-visible{outline:none}.e-eye:focus-visible span,.e-reset:focus-visible span{outline:2px solid #d33d3d;outline-offset:2px}
.chip,.tab{transition:background-color .15s ease,opacity .3s ease}
@media (hover: hover){.tab.is-idle:hover{background-color:#e9e9e9 !important}.chip:hover .mark:not(.is-on) .mark-art{background-color:#ffffff;transform:translateY(calc(-1 * var(--pop,4px))) scale(1.03);box-shadow:0 0 0 1px rgba(40,32,24,.08),0 1px 2px rgba(40,32,24,calc(.1 * var(--lsh,1))),0 calc(var(--pop,4px) * .75 + 2px) 10px rgba(40,32,24,calc(.14 * var(--lsh,1)));transition-timing-function:cubic-bezier(.2,1.6,.4,1),ease,ease,ease;transition-timing-function:linear(0, 0.095 2%, 0.269 4.8%, 0.659 10.7%, 0.835 13.7%, 0.958 16.3%, 1.052 18.9%, 1.118 21.5%, 1.16 24.3%, 1.176 27.6%, 1.161 31.7%, 1.083 39.6%, 1.01 47.4%, 0.978 54.1%, 0.973 62.8%, 1.004 85.7%, 1),ease,ease,ease}.chip.is-faded:hover{opacity:.75 !important}.e-eye.is-closed:hover span{background:#3d3d3d !important;border-color:#3d3d3d !important}.e-reset:hover span{background:#e9e9e9 !important}.e-info a:hover{color:#d4d4d4 !important}.chip.is-picked:hover .cnt-n{opacity:0}.chip.is-picked:hover .cnt-x{opacity:1}.chip.is-picked:hover .cnt-x svg{transform:scale(1)}}
.chip.is-faded:focus-visible{opacity:1 !important}
/* v16: a press shows at once, before the board redraws: a party's mark dips (v19: the letters themselves, on the separate scale property, so it never fights the pop) and a poll tab darkens under the finger, and touch taps skip the browser's double-tap wait */
button{touch-action:manipulation}
.chip:active .mark-art{scale:.94}
.tab.is-idle:active{background-color:#d4d4d4 !important;transition-duration:0s !important}
.e-reset:active span{background:#d4d4d4 !important;transition-duration:0s !important}
/* Motion (from v10): everything that moves when you click shares two springs, written out as linear() curves (a browser without linear() keeps the cubic-bezier declared before it). Pop: on target in about 80ms, overshoots by about a sixth, dips back once and has settled by 460ms; for pegs and buttons going up and for the Majority flag. Settle: just as quick, with one smaller bounce; for pegs sinking into their holes and buttons dropping back flat. v24: the pegs run the same two curves in the script (CURVE.pop and CURVE.settle). */
/* The Majority flag over the dashed line stays hidden until the parties picked reach a majority, then fades in and rises off the line on the same spring the party buttons lift with. */
.e-maj{transition:opacity .12s ease,transform .46s cubic-bezier(.2,1.6,.4,1),visibility .46s;transition-delay:var(--majd,0ms);transition-timing-function:ease,linear(0, 0.095 2%, 0.269 4.8%, 0.659 10.7%, 0.835 13.7%, 0.958 16.3%, 1.052 18.9%, 1.118 21.5%, 1.16 24.3%, 1.176 27.6%, 1.161 31.7%, 1.083 39.6%, 1.01 47.4%, 0.978 54.1%, 0.973 62.8%, 1.004 85.7%, 1),ease}
/* The flag's pin runs from the flag down to the board at the far end of the dashed line (--stick is that reach below the top of the chart). It is drawn before the pegs, so pegs in front of it hide its foot. */
.e-maj::after{content:"";position:absolute;left:50%;top:100%;width:2px;margin-left:-1px;height:calc(14px + var(--stick));background:#181818}
/* About this poll: the i in the box's top left-hand corner (v24 revised; it sat in the top right-hand corner, where the refresh button now is), under the start of the tab rule, drops a black panel down from that rule. It lies over the box and follows whichever poll is chosen until the i is pressed again, or (v19) until a click or tap lands anywhere but the i or one of the panel's links (watchInfo in the script). */
.e-info{animation:e-drop .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes e-drop{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
/* v17: the half circle sits at the top of the box. The chart is as tall as the half circle at the box's full width, plus the 40px band for the Majority flag, and gives up height when the party rows below need it (their least is --rowmin a row: 58px, 52px on phones); the half circle then draws narrower, centred. --chin is the box's inset from the embed's edge, both sides together: the side padding, the box's 1.5px sides and its inner padding (20 + 1.5 + 16px a side; 14 + 1.5 + 14px on phones). */
.e-box{--chin:75px}
/* v17: the party section takes all the height under the half circle, with 12px between them, and is a size container, so the rows can size their pegs against both its width and its height */
.e-parties{--rowmin:58px;min-height:calc(var(--nrows,6) * var(--rowmin))}
/* Party rows sit inside the party section with --rp of padding of their own each side (12px, 8px on phones), and share its height evenly (v17): party name, one peg per projected seat (filled column by column so each party reads as a bar of pegs), a dotted leader, then the seat count right-aligned in a column. --rows is how many rows of pegs each party gets and --cols the columns the largest party in any poll then needs (Johannesburg: 113 seats), so pegs keep one size across parties and polls. v17: the script picks --rows and --cols for the room the rows have (--fit-rows and --fit-cols); until it has measured, 4 rows of 29 columns, or 7 rows of 17 on phones. --dot is the biggest peg that fits across a row (100cqw is the section's width) and down it (100cqh / --nrows is a row's height, keeping --air clear and room for a picked peg to stand), capped at --dmax; the dotted leader takes up any slack. v12: every peg top is an exact circle a whole number of pixels across (rounded down, where the browser can round), with whole-pixel gaps (--dg across, --dv down), so every peg lands on the pixel grid the same way and none is drawn as an oval. A party's mark (v19: its initials) hangs 8px into the rows' padding, centred in its column. v24: once the script has measured the rows it also sets --fit-dot, the peg size it worked out the same way, so the CSS and the canvas that draws the pegs always agree on it. */
.e-rows{--name:96px;--g:8px;--count:42px;--dg:4px;--dv:4px;--rows:var(--fit-rows,4);--cols:var(--fit-cols,29);--dmax:9px;--rp:12px;--air:8px;--dot:var(--fit-dot,min(var(--dmax),calc((100cqw - 2 * var(--rp) - var(--name) - 2 * var(--g) - var(--count) - (var(--cols) - 1) * var(--dg)) / var(--cols)),calc((100cqh / var(--nrows,6) - var(--air) - (var(--rows) - 1) * var(--dv)) / (var(--rows) + 1.8 * var(--hk,.174)))))}
@supports (width:round(down,1.5px,1px)){.e-rows{--dot:var(--fit-dot,round(down,min(var(--dmax),calc((100cqw - 2 * var(--rp) - var(--name) - 2 * var(--g) - var(--count) - (var(--cols) - 1) * var(--dg)) / var(--cols)),calc((100cqh / var(--nrows,6) - var(--air) - (var(--rows) - 1) * var(--dv)) / (var(--rows) + 1.8 * var(--hk,.174)))),1px))}}
/* v24: a party's pegs are drawn on a canvas laid over this box, which keeps the room v21's grid of pegs took: --pc columns (as many as the party's seats need, so each party's bar is as long as its share) and --rows rows of --dot pegs, --dg and --dv apart, with room above for a picked party's tops to rise into. The canvas reaches 4px past the box on every side, and further below for the shadows (ROW_PAD in the script). */
.pdots{flex:none;position:relative;display:block;width:max(0px,calc(var(--pc,0) * var(--dot) + (var(--pc,0) - 1) * var(--dg)));height:calc(var(--rows) * var(--dot) + (var(--rows) - 1) * var(--dv) + var(--dot) * 1.8 * var(--hk,.174))}
.e-pegs,.pdots canvas{display:block;pointer-events:none}
/* v19: party marks are the parties' initials (the v19 note at the top has the whole story). Revised: at rest a label is plain text on the page; picked (is-on), its face (.mark-art) turns into a white button with the letters in it, rising --pop and swelling a touch on the pegs' pop spring, with a faint hairline round its edge and two soft shadows straight down the page, a tight one where it leaves the paper and a wider one a little below, in the same warm dark tone as v18's (the Label shadow tweak scales how dark the shadows are); left out, it settles back flat with the pegs' smaller bounce and its fill, edge and shadows fade. The fill and shadows run on a plain ease, so they never overshoot. v15: when the intro drains the board, a mark drops flat as the wave first reaches its party's seats on the half circle; --pd is that wait (0 at any other time). */
/* v20: the white button now shows under a mouse pointer (in the hover rules near the top); picked, the button is black, the poll tabs' #181818, with white letters (their colour comes from the script and changes on .mark-name), and its fill changes in .15s so a click turns it black at once */
.mark-art{background-color:rgba(255,255,255,0);transform:translateY(0) scale(1);box-shadow:0 0 0 0 rgba(40,32,24,0),0 0 0 0 rgba(40,32,24,0),0 0 0 0 rgba(40,32,24,0);transition:transform .46s cubic-bezier(.2,1.25,.4,1),box-shadow .3s ease,translate .15s ease,background-color .15s ease;transition-timing-function:linear(0, 0.069 1.3%, 0.195 3%, 0.591 7.8%, 0.746 10%, 0.859 12%, 0.945 13.9%, 1.012 16.1%, 1.055 18.5%, 1.075 21.5%, 1.065 25.9%, 1.007 36.7%, 0.994 46.1%, 1),ease,ease,ease;transition-delay:var(--pd,0ms),var(--pd,0ms),0ms,var(--pd,0ms)}
.mark.is-on .mark-art{background-color:#181818;transform:translateY(calc(-1 * var(--pop,4px))) scale(1.03);box-shadow:0 0 0 1px rgba(40,32,24,.08),0 1px 2px rgba(40,32,24,calc(.1 * var(--lsh,1))),0 calc(var(--pop,4px) * .75 + 2px) 10px rgba(40,32,24,calc(.14 * var(--lsh,1)));transition-timing-function:cubic-bezier(.2,1.6,.4,1),ease,ease,ease;transition-timing-function:linear(0, 0.095 2%, 0.269 4.8%, 0.659 10.7%, 0.835 13.7%, 0.958 16.3%, 1.052 18.9%, 1.118 21.5%, 1.16 24.3%, 1.176 27.6%, 1.161 31.7%, 1.083 39.6%, 1.01 47.4%, 0.978 54.1%, 0.973 62.8%, 1.004 85.7%, 1),ease,ease,ease}
/* v15: while the intro holds the full board (is-snap on the box) nothing on the board or in the rows transitions, so the board opens, or switches to a new poll, already standing in place; the drain then runs on the usual springs. v24: the pegs' canvases do the same. */
.e-box.is-snap .mark-art,.e-box.is-snap .mark-name,.e-box.is-snap .e-tally-in,.e-box.is-snap .chip{transition:none !important}
/* v21: the tally (0/136 and on) stands in a mask the size of its own line: its box clips along its bottom edge only. While the intro holds the full board (is-hidden) the tally waits out of sight below that edge; as the board drains it rises into place, easing out over --tlt (the Wave time, 400ms at least) after waiting --tld (a fifth of it); at any other time it simply stands in place. */
.e-tally-in{transform:translateY(0);transition:transform var(--tlt,700ms) cubic-bezier(.16,1,.3,1) var(--tld,140ms)}
.e-tally-in.is-hidden{transform:translateY(115%)}
/* v20: how the labels draw, all of it set by the tweaks under Labels: Label size (--fs, in px), Label weight (--lfw), Letter spacing (--lls) and Line height (--llh). Revised from v19, where the size and letter-spacing sat on each row's mark and the labels were Bold: they are Regular now. A label's face (.mark-art, the button once hovered or picked) is the width of its column, with 8px of padding each side, and as tall as a line of the label plus .37em above and below it, so the line height sets how tall the button is; it takes that from the label size rather than from its own label, so every button matches even where a label has had to shrink. A label too long for its button draws just small enough to fit (--tw is its width in ems at the chosen weight and --tn its letter count less one, both from the script), and the letter-spacing after its last letter is taken back off, so it stays centred. Geist's capitals sit dead centre on any line height, so the letters need no nudge. */
.mark{font-size:var(--fs,17px)}
.mark-art{height:calc((var(--llh,1.2) + .74) * 1em)}
.mark-name{font-size:min(1em,calc((var(--name) - 8px - var(--tn,0) * var(--lls,0px)) / var(--tw,1)));font-weight:var(--lfw,400);letter-spacing:var(--lls,0px);line-height:var(--llh,1.2);margin-right:calc(-1 * var(--lls,0px))}
.mark-name{transition:color .15s ease var(--pd,0ms)}
/* v24 revised: under a mouse pointer (the hover rules near the top) or keyboard focus, a picked party's seat count (.cnt-n) gives way to an X (.cnt-x), to show that a click takes the party out: the number fades out as the X fades in and pops up to full size on the pegs' pop spring, and both swap back when the pointer leaves. The number keeps its room while hidden, so nothing in the row moves. */
.cnt-n{display:inline-block;transition:opacity .12s ease}
.cnt-x{opacity:0;pointer-events:none;transition:opacity .12s ease}
.cnt-x svg{transform:scale(.5);transition:transform .46s cubic-bezier(.2,1.6,.4,1);transition-timing-function:linear(0, 0.095 2%, 0.269 4.8%, 0.659 10.7%, 0.835 13.7%, 0.958 16.3%, 1.052 18.9%, 1.118 21.5%, 1.16 24.3%, 1.176 27.6%, 1.161 31.7%, 1.083 39.6%, 1.01 47.4%, 0.978 54.1%, 0.973 62.8%, 1.004 85.7%, 1)}
.chip.is-picked:focus-visible .cnt-n{opacity:0}.chip.is-picked:focus-visible .cnt-x{opacity:1}.chip.is-picked:focus-visible .cnt-x svg{transform:scale(1)}
/* v25: Other's minus and plus (the v25 note at the top has the whole story). --stw is the room the two buttons take in Other's row, between its dotted leader and its count, and --ocw the count's own width there, held steady so the buttons never shift as the count changes. The buttons lie over that room, outside the row's own button, so a press on them never toggles Other, and while the pointer is on them the count stays a number. A button at its end (none of Other's seats left to take out, or none left to add) greys out. Held down, they never select text or call up a phone's long-press menu. */
.e-rows{--stw:76px;--ocw:54px}
.oth-step{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.step{transition:opacity .15s ease}
.step-face{transition:background-color .15s ease}
.step.is-off{opacity:.28;cursor:default !important}
.step:focus-visible{outline:none}.step:focus-visible .step-face{outline:2px solid #d33d3d;outline-offset:2px}
@media (hover: hover){.step:not(.is-off):hover .step-face{background-color:#e9e9e9 !important}}
.step:not(.is-off):active .step-face{background-color:#d4d4d4 !important;scale:.92;transition-duration:0s}
/* Phones (embed narrower than 640px): the fixed height stays the same, only the arrangement inside changes. v17: the half circle takes the box's full width and the party rows take whatever height is left, their pegs sized to fill it. */
@container emb (max-width: 639.98px){
.e-pad{padding:10px 14px 16px !important}
.e-kicker{font-size:10.5px !important;letter-spacing:.08em !important}
.e-title{font-size:31px !important;margin-top:10px !important}
.e-tabs{margin-top:16px !important}
.tab{height:52px !important;padding:0 8px !important}
.tab-name{white-space:normal !important;font-size:11px !important;letter-spacing:.03em !important}
.tab-when{font-size:11px !important}
.e-box{padding:8px 14px 12px !important;--chin:59px}
.e-maj{font-size:11.5px !important;padding:4px 8px 3px calc(8px + 0.12em) !important}
.e-parties{--rowmin:52px}
.e-rows{--name:76px;--g:6px;--count:37px;--dg:2px;--dv:2px;--rows:var(--fit-rows,7);--cols:var(--fit-cols,17);--dmax:10px;--rp:8px;--stw:62px;--ocw:46px}
.step{width:28px !important}.step-face{width:24px !important;height:24px !important}
.cnt{font-size:16px !important}
.chip-nr-note{font-size:12px !important}
.e-info{padding:12px 14px 14px !important}
.e-info-title{font-size:16px !important}
.e-info-body{font-size:13px !important}
.e-info-foot{font-size:12px !important}
.e-facts{column-gap:20px !important}
.e-fact dd{font-size:13px !important}
}
@media (prefers-reduced-motion: reduce){.e-box,.chip,.tab,.mark-art,.e-maj,.e-tally-in,.cnt-n,.cnt-x,.cnt-x svg,.e-reset span,.step,.step-face{transition:none !important}.e-info{animation:none !important}}
</style>

<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="max-width: {{frameMax}}; margin: 0 auto; background: #ffffff; color: #171717; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; container-type: inline-size; container-name: emb">
  <div class="e-pad" style="height: 920px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; overflow: hidden; position: relative">

    <h1 class="e-title" style="flex: none; margin: 12px 0 0; font-family: 'DM Custom', DMCustom, Georgia, serif; font-weight: 700; font-size: 38px; line-height: 1.05; letter-spacing: -0.4px; color: #171717; text-wrap: balance; margin-top: 5px">Who can build a coalition in Cape Town?</h1>

    <div class="e-tabs" style="flex: none; margin-top: 20px; position: relative; z-index: 3">
      <div role="group" aria-label="Choose a poll" style="display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; border-bottom: 3px solid #181818">
        <sc-for list="{{polls}}" as="p" hint-placeholder-count="3">
          <button type="button" class="tab {{p.cls}}" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="height: 54px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 12px; background-color: {{p.bg}}; color: {{p.fg}}; border: 0; border-radius: {{p.radius}}; cursor: {{p.cursor}}; text-align: left; line-height: 1.15">
            <span class="tab-name" style="display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 700; font-stretch: 87.5%; letter-spacing: 0.06em; text-transform: uppercase">{{p.name}}</span>
            <small class="tab-when" style="display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Geist, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 400; color: {{p.sub}}">{{p.when}}</small>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{infoOpen}}" hint-placeholder-val="{{ false }}">
        <div id="{{infoId}}" class="e-info" role="region" aria-label="About this poll" style="position: absolute; left: 0; right: 0; top: 100%; box-sizing: border-box; padding: 14px 16px 16px; background: #181818; color: #ffffff; font-family: Geist, 'Helvetica Neue', Arial, sans-serif">
          <p style="margin: 0; padding-right: 40px; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-stretch: 87.5%; font-weight: 700; font-size: 11px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; color: #cdbfa7">About this poll</p>
          <h2 class="e-info-title" style="margin: 7px 0 0; padding-right: 40px; font-size: 17px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; color: #ffffff">{{info.title}}</h2>
          <p class="e-info-body" style="margin: 8px 0 0; font-size: 14px; font-weight: 400; line-height: 1.45; color: #d4d4d4; text-wrap: pretty">{{info.body}}</p>
          <dl class="e-facts" style="margin: 12px 0 0; padding-top: 10px; border-top: 1px solid #3d3d3d; display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 10px">
            <sc-for list="{{info.facts}}" as="f" hint-placeholder-count="4">
              <div class="e-fact" style="min-width: 0">
                <dt style="font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-stretch: 87.5%; font-weight: 700; font-size: 10.5px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; color: #a3a3a3">{{f.k}}</dt>
                <dd style="margin: 5px 0 0; font-size: 14px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; color: #ffffff; white-space: nowrap">{{f.v}}</dd>
              </div>
            </sc-for>
          </dl>
          <p class="e-info-foot" style="margin: 12px 0 0; font-size: 12.5px; line-height: 1.45; color: #a3a3a3">Seat numbers are estimates: each party’s share in this poll applied to the council’s 231 seats. <a href="{{info.url}}" target="_blank" rel="noopener" style="color: #ffffff; text-underline-offset: 2px">{{info.linkText}}</a></p>
        </div>
      </sc-if>

    </div>

    <div class="e-box {{boxCls}}" id="{{boxId}}" style="flex: 1 1 0; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 16px 14px; border: 1.5px solid #181818; border-top: 0; border-radius: 0 0 8px 8px; --majd: {{majd}}; --tlt: {{tallyT}}; --tld: {{tallyD}}">

      <div class="e-chart" id="{{chartId}}" onMouseMove="{{hoverPeg}}" onMouseLeave="{{leavePeg}}" style="flex: 0 1 auto; min-height: 0; height: calc((100cqw - var(--chin)) * {{stage.k}} + 40px); position: relative; container-type: size">
        <div class="e-stage" style="position: absolute; left: {{stage.left}}; top: {{stage.top}}; width: {{stage.w}}; height: {{stage.h}}; container-type: inline-size; --stick: {{stage.stick}}">
          <div role="img" aria-label="{{chartLabel}}" style="position: absolute; inset: 0">
            <div aria-hidden="true" style="position: absolute; left: 0; top: {{stage.boardTop}}; width: 100cqw; height: 53cqw; transform: scaleY({{stage.sq}}); transform-origin: 0 0">
              <span style="position: absolute; left: 50cqw; top: 0.21cqw; height: {{stage.lineH}}; border-left: 1.5px dashed #181818; transform: translateX(-0.75px)"></span>
            </div>
          </div>
          <div class="e-maj" style="position: absolute; left: 50%; bottom: calc(100% + 14px); transform: {{majTransform}}; transform-origin: 50% 100%; opacity: {{majOpacity}}; visibility: {{majVisibility}}; padding: 5px 10px 4px calc(10px + 0.12em); border-radius: 5px; background: #d33d3d; color: #ffffff; font-stretch: 87.5%; font-weight: 700; font-size: 13px; line-height: 1; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap">Majority</div>
          <canvas class="e-pegs" id="{{boardId}}" aria-hidden="true" style="position: absolute; left: {{stage.cvL}}; top: {{stage.cvT}}; width: {{stage.cvW}}; height: {{stage.cvH}}"></canvas>
          <div aria-live="polite" style="position: absolute; left: 50%; bottom: calc({{stage.tallyBottom}} - 0.145em); transform: translateX(-50%); display: flex; align-items: baseline; clip-path: inset(-100% -100% 0 -100%); font-family: Geist, 'Helvetica Neue', Arial, sans-serif; font-size: clamp(24px, 9cqw, 60px); line-height: 1; color: #171717; white-space: nowrap"><span class="e-tally-in {{tallyCls}}" style="display: flex; align-items: baseline"><span style="font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{tally}}</span><span style="margin-left: 0.25em; font-size: max(11px, 0.3em); font-weight: 600; letter-spacing: 0; color: #5e574e">/{{majority}}</span></span></div>
        </div>
      <button type="button" class="e-eye {{eyeCls}}" aria-label="About this poll" aria-expanded="{{infoExpanded}}" id="{{eyeId}}" aria-controls="{{infoId}}" onClick="{{toggleInfo}}" style="position: absolute; top: -8px; z-index: 1; width: 44px; height: 44px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 50%; color: #181818; cursor: pointer; left: -14px">
        <span aria-hidden="true" style="width: 30px; height: 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid {{eyeRing}}; background: {{eyeBg}}; color: #ffffff; transition: background-color .15s ease, border-color .15s ease"><svg width="27" height="27" viewBox="-750 -750 1500 1500" aria-hidden="true" style="display: block; fill: currentColor"><path d="M123.9 369.7V322.9L79.9 319.9C74.5 319.3 69.7 316.8 65.4 312.4C61.1 308 58.9 302.7 58.9 296.5V-129.7H12.7L-120.4 -80V-39H-62.1V296.5C-62.1 302.7 -64.1 308 -68.1 312.4C-72.1 316.8 -76.7 319.3 -82.1 319.9L-123.9 322.9V369.7H123.9ZM50.9 -347.3C37 -362.2 20.2 -369.7 0.7 -369.7C-18.9 -369.7 -35.5 -362.2 -49.2 -347.3C-62.8 -332.3 -69.6 -314.1 -69.6 -292.6C-69.6 -271.2 -62.8 -252.8 -49.2 -237.5C-35.5 -222.2 -18.9 -214.6 0.7 -214.6C20.2 -214.6 37 -222.2 50.9 -237.5C64.9 -252.8 71.9 -271.2 71.9 -292.6C71.9 -314.1 64.9 -332.3 50.9 -347.3Z"></path></svg></span>
      </button>
      <button type="button" class="e-reset" aria-label="Clear the board" title="Clear the board" onClick="{{resetBoard}}" style="position: absolute; top: -8px; right: -14px; z-index: 1; width: 44px; height: 44px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 50%; color: #181818; cursor: pointer">
        <span aria-hidden="true" style="width: 30px; height: 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #ffffff; color: #181818; transition: background-color .15s ease"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="display: block; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round"><path d="M18.76 13.81a7 7 0 1 1-2.26-7.17l2 1.67"></path><path d="M18.5 3.8v4.5h-4.5"></path></svg></span>
      </button></div>

      <div class="e-divide" aria-hidden="true" style="flex: none; height: 0; margin-top: 12px; border-top: 1px solid #181818"></div>

      <section class="e-parties" id="{{partsId}}" aria-label="Parties" style="flex: 1 1 0; margin-top: 12px; container-type: size; --nrows: {{nRows}}">
        <div class="e-rows" style="height: 100%; box-sizing: border-box; padding: 0 var(--rp); display: grid; grid-template-rows: repeat(var(--nrows), minmax(0, 1fr)); --fit-rows: {{fit.rows}}; --fit-cols: {{fit.cols}}; --fit-dot: {{fit.dot}}; --hk: {{stage.hk}}; --fs: {{labelSize}}; --lfw: {{labelWeight}}; --lls: {{letterSpacing}}; --llh: {{lineHeight}}; --pop: {{labelPop}}; --lsh: {{labelShadow}}">
          <sc-for list="{{makeup}}" as="mk" hint-placeholder-count="6">
            <sc-if value="{{mk.clickable}}" hint-placeholder-val="{{ true }}">
              <button type="button" class="{{mk.cls}}" aria-pressed="{{mk.pressed}}" aria-label="{{mk.aria}}" onClick="{{mk.pick}}" style="min-width: 0; min-height: 0; height: 100%; box-sizing: border-box; display: grid; grid-template-columns: var(--name) minmax(0, 1fr); align-items: center; column-gap: var(--g); padding: 0 0 1px; background: transparent; border: 0; border-radius: 0; color: #171717; text-align: left; cursor: pointer; opacity: {{mk.op}}">
                <span class="mark {{mk.markCls}}" style="min-width: 0; height: 100%; margin-left: -8px; display: flex; align-items: center; justify-content: center; --pd: {{mk.pd}}; --tw: {{mk.tw}}; --tn: {{mk.tn}}">
                  <span class="mark-art" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 6px">
                    <span class="mark-name" style="display: block; white-space: nowrap; font-family: Geist, 'Helvetica Neue', Arial, sans-serif; color: {{mk.nameFg}}">{{mk.name}}</span>
                  </span>
                </span>
                <span style="min-width: 0; display: flex; align-items: center">
                  <span class="pdots" aria-hidden="true" style="--pc: {{mk.pcols}}"><canvas id="{{mk.cvId}}" style="position: absolute; left: -4px; top: -4px; width: calc(100% + 8px); height: calc(100% + 8px + {{rowShb}})"></canvas></span>
                  <span aria-hidden="true" style="flex: 1 1 0; min-width: 0; height: 4px; margin-left: var(--g); background: radial-gradient(circle, #a3978a 0.9px, transparent 1.3px) 0 50% / 5px 4px repeat-x"></span>
                  <span class="cnt" style="flex: none; position: relative; min-width: var(--count); box-sizing: border-box; padding-left: 6px; text-align: right; font-family: Geist, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; color: #171717"><span class="cnt-n">{{mk.label}}</span><span class="cnt-x" aria-hidden="true" style="position: absolute; right: -1px; top: 50%; width: 16px; height: 16px; margin-top: -8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M3 3l10 10M13 3L3 13"></path></svg></span></span>
                </span>
              </button>
            </sc-if>
            <sc-if value="{{mk.nr}}" hint-placeholder-val="{{ false }}">
              <div class="chip-nr" role="group" aria-label="{{mk.aria}}" title="{{mk.title}}" style="min-width: 0; min-height: 0; height: 100%; box-sizing: border-box; display: grid; grid-template-columns: var(--name) minmax(0, 1fr); align-items: center; column-gap: var(--g); padding: 0 0 1px; color: #5e574e; opacity: {{mk.op}}">
                <span class="mark" style="min-width: 0; height: 100%; margin-left: -8px; display: flex; align-items: center; justify-content: center; --tw: {{mk.tw}}; --tn: {{mk.tn}}">
                  <span class="mark-art" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 6px">
                    <span class="mark-name" style="display: block; white-space: nowrap; font-family: Geist, 'Helvetica Neue', Arial, sans-serif; color: {{mk.nameFg}}">{{mk.name}}</span>
                  </span>
                </span>
                <span class="chip-nr-note" style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 500">{{mk.note}}</span>
              </div>
            </sc-if>
            <sc-if value="{{mk.step}}" hint-placeholder-val="{{ false }}">
              <div class="oth-row" style="position: relative; min-width: 0; min-height: 0; height: 100%">

  ipsos: { name: "Ipsos", tab: "Ipsos poll", when: "July 2026" },
  sabi:  { name: "News24/SABI", tab: "News24/SABI poll", when: "Aug/Sep 2026" }
};
/* "About this poll" panel copy. Sources: Ipsos's press release of 4 September 2026 and its Cape Town margin of error; News24's Elections Poll '26 methodology page, with its Cape Town sample and margin of error. */
const POLL_INFO = {
  ipsos: {

/* Cape Town v5: Cape Town's council, from metro-coalition-poll-data.xlsx as in the earlier Cape Town and all-metros embeds. Seats = poll share x council size, rounded; Other = the rest of the council.
   null = not reported separately (counted in Other). o = seats taken from Other in a suggested path.
   The Social Research Foundation/The Common Sense poll did not cover Cape Town, so this embed has two polls. */
const METRO = { id: "cape-town", name: "Cape Town", seats: 231, majority: 116,
  order: ["DA", "PA", "OTH", "EFF", "ANC"],
  polls: [
    { id: "ipsos", seats: { DA: 106, PA: 18, EFF: 25, ANC: 60, OTH: 22 },
      paths: [{ p: ["DA", "PA"], o: 0 }, { p: ["DA"], o: 10 }, { p: ["ANC", "EFF", "PA"], o: 22 }] },
    { id: "sabi", seats: { DA: 130, PA: 12, EFF: 15, ANC: 44, OTH: 30 },
      paths: [{ p: ["DA"], o: 0 }, { p: ["DA", "PA"], o: 0 }] }
  ] };

/* v17: the most seats any one party holds in any poll (Other included), which sets how many columns of pegs the party rows need */
const MAXSEATS = Math.max.apply(null, METRO.polls.map(p => Math.max.apply(null, Object.values(p.seats).filter(v => v != null))));
/* v17: how many rows of pegs a party row may have. bestFit tries each count for the room the party rows have (W by H, in px) and keeps the one that gives the biggest whole-pixel pegs, and the fewest rows on a tie (longer bars, more air between them). c holds the rows' measures as the CSS sets them, and works the peg size out the same way the CSS does. */
const FIT = { min: 3, max: 12 };
function bestFit(W, H, c) {
  const A = W - 2 * c.rp - c.name - 2 * c.g - c.count, rowH = H / c.n;
  let best = null;
  for (let R = FIT.min; R <= FIT.max; R++) {
    const C = Math.ceil(MAXSEATS / R);
    const d = Math.floor(Math.min(c.dmax, (A - (C - 1) * c.dg) / C, (rowH - c.air - (R - 1) * c.dv) / (R + 1.8 * c.hk)) + 1e-6);
    if (!best || d > best.dot) best = { rows: R, cols: C, dot: d };
  }
  return best;
}

/* Hemicycle on the board: rows chosen so seats sit evenly along and across rows; positions in a 1000 x 530 box seen from straight above.
   fill = the seats in the order a coalition fills them (from the left end); depth = the same seats back to front, the order they are drawn in.
   r = a peg's radius: a little narrower than v9's dot, so the board shows between pegs and their shadows have somewhere to fall. */
function seatLayout(N) {
  const CX = 500, CY = 495, R0 = 172, EDGE = 494.6, K = 0.427;
  let best = null;
  for (let rows = 6; rows <= 14; rows++) {
    let R1 = 480, dot = 14.6, radial = 0, arc = 0;
    for (let it = 0; it < 30; it++) {
      radial = (R1 - R0) / (rows - 1);
      arc = Math.PI * rows * (R0 + R1) / 2 / N;
      dot = K * Math.min(radial, arc);
      R1 = EDGE - dot;
    }
    const score = Math.abs(Math.log(arc / radial));
    if (!best || score < best.score) best = { rows: rows, R1: R1, dot: dot, pitch: Math.min(radial, arc), score: score };
  }
  const radii = [];
  for (let i = 0; i < best.rows; i++) radii.push(R0 + (best.R1 - R0) * i / (best.rows - 1));
  const sumR = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map(r => Math.floor(N * r / sumR));
  const rem = N - counts.reduce((a, b) => a + b, 0);
  radii.map((r, i) => [N * r / sumR - counts[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rem).forEach(e => { counts[e[1]]++; });
  const pts = [];
  radii.forEach((r, i) => {
    const n = counts[i];
    for (let j = 0; j < n; j++) {
      const a = n === 1 ? Math.PI / 2 : Math.PI * (1 - j / (n - 1));
      pts.push({ x: CX + r * Math.cos(a), y: CY - r * Math.sin(a), a: a });
    }
  });
  pts.sort((p, q) => q.a - p.a || p.y - q.y);
  const fill = pts.map(p => ({ x: p.x, y: p.y, a: p.a }));   // v13: a, each seat's angle, sets its place in the wave
  const depth = fill.map((p, i) => i).sort((i, j) => fill[i].y - fill[j].y || fill[i].x - fill[j].x);
  return { fill: fill, depth: depth, r: 0.37 * best.pitch };
}

/* v24: the pegs are drawn on canvases (the v24 note at the top has the whole story), and what follows down to the Component is the drawing. First the motion curves the CSS used, as functions the script can run: lin() reads a CSS linear() curve, given as [output, input] stops, and cb() a CSS cubic-bezier(), solved once into a table. pop and settle are the two springs (from v10, the same stops as the CSS's), ease is CSS's ease (the hop's switch, v12), hopIn and hopOut the majority hop swelling in and dying away with a slight dip (v12), and rise and fall the two halves of a hop. */
const lin = stops => x => {
  if (x <= 0) return stops[0][0];
  if (x >= 1) return stops[stops.length - 1][0];
  let i = 1;
  while (stops[i][1] < x) i++;
  const a = stops[i - 1], b = stops[i];
  return a[0] + (b[0] - a[0]) * (x - a[1]) / (b[1] - a[1]);
};
const cb = (x1, y1, x2, y2) => {
  const n = 160, xs = [], ys = [];
  for (let i = 0; i <= n; i++) { xs.push(bez(x1, x2, i / n)); ys.push(bez(y1, y2, i / n)); }
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = n;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] < x) lo = m; else hi = m; }
    return ys[lo] + (ys[hi] - ys[lo]) * (x - xs[lo]) / ((xs[hi] - xs[lo]) || 1);
  };
};
const CURVE = {
  pop: lin([[0, 0], [0.095, 0.02], [0.269, 0.048], [0.659, 0.107], [0.835, 0.137], [0.958, 0.163], [1.052, 0.189], [1.118, 0.215], [1.16, 0.243], [1.176, 0.276], [1.161, 0.317], [1.083, 0.396], [1.01, 0.474], [0.978, 0.541], [0.973, 0.628], [1.004, 0.857], [1, 1]]),
  settle: lin([[0, 0], [0.069, 0.013], [0.195, 0.03], [0.591, 0.078], [0.746, 0.1], [0.859, 0.12], [0.945, 0.139], [1.012, 0.161], [1.055, 0.185], [1.075, 0.215], [1.065, 0.259], [1.007, 0.367], [0.994, 0.461], [1, 1]]),
  ease: cb(0.25, 0.1, 0.25, 1),
  hopIn: cb(0.2, 0.8, 0.3, 1),
  hopOut: cb(0.3, 1.3, 0.5, 1),
  rise: cb(0.333, 0.667, 0.667, 1),
  fall: cb(0.333, 0, 0.667, 0.333)
};
/* v12's hop as a peg's height through one loop (f runs 0 to 1): up like a tossed ball, back down, a small rebound, then a beat seated */
const HOP_KEYS = [[0, 0, CURVE.rise], [0.34, 1, CURVE.fall], [0.68, 0, CURVE.rise], [0.81, 0.16, CURVE.fall], [0.94, 0, null]];
const hopAt = f => {
  for (let i = 0; i < HOP_KEYS.length - 1; i++) {
    const a = HOP_KEYS[i], b = HOP_KEYS[i + 1];
    if (f < b[0]) return a[1] + (b[1] - a[1]) * a[2]((f - a[0]) / (b[0] - a[0]));
  }
  return 0;
};
/* A channel is one value easing from a to b over dur ms, starting at t0 (any wait already added), the way a CSS transition runs: it holds a until t0, and a new target starts from wherever the value is at that moment */
const chan = v => ({ a: v, b: v, t0: 0, dur: 0, e: null });
const chanAt = (c, now) => {
  if (c.a === c.b || now >= c.t0 + c.dur) return c.b;
  if (now <= c.t0) return c.a;
  return c.a + (c.b - c.a) * c.e((now - c.t0) / c.dur);
};
const chanTo = (c, v, now, wait, dur, e) => {
  if (c.b === v) return false;
  c.a = chanAt(c, now); c.b = v; c.t0 = now + wait; c.dur = dur; c.e = e;
  return true;
};
const chanSet = (c, v) => { c.a = c.b = v; c.dur = 0; };
/* A peg's colours change as one 120ms linear fade (v13: once the wave reaches it), drawn as the new colours laid over the old; a fade cut short lands on whichever colour it was nearer */
const FADE = 120;
const fadeTo = (c, key, now, wait) => {
  if (c.t === key) return false;
  if (c.f !== c.t && now - c.t0 >= FADE / 2) c.f = c.t;
  c.t = key; c.t0 = now + wait;
  return true;
};
const fadeAt = (c, now) => c.f === c.t ? 1 : Math.min(1, Math.max(0, (now - c.t0) / FADE));
const TAU = Math.PI * 2;
/* The holes (v11): dark under a standing peg, the faintest tone under a sunk one */
const HOLE = { dark: "#6f675b", pale: "#e3ddd3" };
/* Colours as numbers, so a fade can mix them the way a CSS colour transition does */
const rgbOf = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
const mix = (a, b, k) => "rgb(" + Math.round(a[0] + (b[0] - a[0]) * k) + "," + Math.round(a[1] + (b[1] - a[1]) * k) + "," + Math.round(a[2] + (b[2] - a[2]) * k) + ")";
const HOLE_RGB = { dark: rgbOf(HOLE.dark), pale: rgbOf(HOLE.pale) };
/* The pegs' shadows' warm dark tone (v18), at alpha a */
const ink = a => "rgba(70,56,40," + Math.max(0, Math.min(1, a)).toFixed(4) + ")";
/* Each canvas is drawn at the screen's own pixels, one for one, so the browser never has to rescale it, which would soften the pegs; a 1x screen gets twice its pixels, which it shrinks evenly into smooth edges */
const screenPx = () => (typeof window !== "undefined" && window.devicePixelRatio) || 1;
const overSample = () => screenPx() < 1.5 ? 2 : 1;
/* How far, in px, a party row's canvas reaches past its pegs on every side (the template's canvas says the same), so outlines and soft shadows are never cut off */
const ROW_PAD = 4;

/* v24: everything the board's canvas needs that changes only with the tweaks, in the half circle's 1000-wide units like the rest of the chart: each seat's place (x across, y down from the top of the chart), the order they are drawn in (back to front), a peg's radii (r across, ry front to back, foreshortened by the camera) and its hole's (hx, hy), how far a picked peg's top stands (riseUp) and a left-out one sinks (sink), how far a standing peg's shadow stretches (ssu) and how much further a hop stretches it (shk, from v12), each peg's own hop loop (v12: its length hd and starting point hp, in seconds, and its share hh of the Hop height), and how far the canvas reaches past the chart's box on each side (ml, mr, mt, mb), so the tallest top a spring and a hop can throw and the longest shadow are never cut off. W and H are the canvas's own width and height. */
function boardGeo(lay, o) {
  const r = lay.r, ry = r * o.sq, hx = r + PEG.hole, hy = (r + PEG.hole) * o.sq;
  const riseUp = o.up * o.hk, sink = PEG.sink * o.sq;
  const ssu = (2 * r + o.up * o.shf) / (2 * r), shk = o.up * o.shf / (2 * r + o.up * o.shf);
  const x = lay.fill.map(p => p.x), y = lay.fill.map(p => o.TOP + p.y * o.sq);
  const hop = lay.fill.map((p, i) => { const hd = o.hopDur(i); return { hd: hd, hp: rnd(i, 3) * hd, hh: HOP.low + (1 - HOP.low) * rnd(i, 4) }; });
  const over = 1.18, side = Math.max(hx, r);
  const reachUp = riseUp * (over + o.hopH) + ry;
  const reachDown = Math.max(hy, sink * 1.08 + ry, ry * (2 * (1 + (ssu - 1) * over) * (1 + o.hopH * shk) - 1));
  const ml = Math.max(0, side - Math.min.apply(null, x)) + 6, mr = Math.max(0, Math.max.apply(null, x) + side - 1000) + 6;
  const mt = Math.max(0, reachUp - Math.min.apply(null, y)) + 6, mb = Math.max(0, Math.max.apply(null, y) + reachDown - o.SH) + 6;
  return { key: o.key, x: x, y: y, depth: lay.depth, hop: hop, r: r, ry: ry, hx: hx, hy: hy, riseUp: riseUp, sink: sink, ssu: ssu, shk: shk, ml: ml, mr: mr, mt: mt, mb: mb, W: 1000 + ml + mr, H: o.SH + mt + mb };
}

/* v24: PegPainter draws the pegs, the half circle on one canvas and each party row's pegs on one of their own, as v21's CSS drew them, from what renderVals() decides (this.plan).
   On the half circle each seat is drawn the way v11 to v21 built it: its shadow (v16: under every peg; v18: a soft warm disc, squashed by the camera, that stretches down the screen towards the reader as the peg stands up), its hole, its foot (the bottom curve of its side), its side (a band from the foot up to the top) and its round top, each outlined with a hairline in the peg's own deep shade (the Outlines tweak). A peg's q is how far it stands: 1 up, 0 sunk into its hole, and past either on a spring's overshoot; its top, foot, side and shadow all follow q, as v21's four transforms did together. Its colours fade when the wave reaches it, on and amp switch its hop on and off (v12), and clock is where it is in its own hop loop, which runs only while the majority holds and the peg is picked.
   In the party rows each peg is a round top in the party colour, standing above its place on a side in the darker tone, both outlined, with a soft shadow falling straight down the page (v12, v18).
   Every piece is drawn as an exact shape at the screen's own pixels, so the pegs are as crisp as v21's; only the soft shadows are copied from a small picture made once. The rows' pegs are drawn in a few batches, one per colour. The canvases are drawn on animation frames only while something moves or has just changed, and never while the embed is out of view. */
class PegPainter {
  constructor() {
    this.b = { cv: null, ctx: null, w: 0, h: 0, dw: 0, dh: 0, s: 1, geo: null, pegs: null, tc: null, toneKey: "", shSprite: null, shKey: "", until: 0, dirty: true, hopping: false, nUp: 0, hopk: 1, psh: 1 };
    this.rows = [];
    this.rg = null;
    this.ds = null;
    this.raf = 0;
    this.last = 0;
    this.visible = true;
    this.gone = false;
    this.io = null;
    this.ro = typeof ResizeObserver === "function" ? new ResizeObserver(es => this.resized(es)) : null;
  }

  // Finds the canvases (React keeps the same ones from render to render; one it replaces is picked up afresh), watches their sizes, and watches whether the embed is on screen
  attach(P) {
    if (typeof document === "undefined") return;
    const hook = (T, el) => {
      if (el === T.cv) return;
      if (T.cv && this.ro) this.ro.unobserve(T.cv);
      T.cv = el || null;
      T.ctx = el && el.getContext ? el.getContext("2d") : null;
      T.w = T.h = T.dw = T.dh = 0;
      T.dirty = true;
      if (!el) return;
      const cs = getComputedStyle(el);
      T.w = parseFloat(cs.width) || el.clientWidth || 0;
      T.h = parseFloat(cs.height) || el.clientHeight || 0;
      // where the browser can say exactly how many screen pixels a canvas covers, it is watched for that, so its pixels can match them one for one
      if (this.ro) { try { this.ro.observe(el, { box: "device-pixel-content-box" }); } catch (err) { this.ro.observe(el); } }
    };
    hook(this.b, document.getElementById(P.boardId));
    P.rows.forEach((pr, j) => {
      const R = this.rows[j] || (this.rows[j] = { cv: null, ctx: null, w: 0, h: 0, s: 1, dots: [], until: 0, dirty: true, color: "", side: "", line: null });
      hook(R, pr ? document.getElementById(pr.cvId) : null);
    });
    for (let j = P.rows.length; j < this.rows.length; j++) hook(this.rows[j], null);
    if (!this.io && typeof IntersectionObserver === "function") {
      const box = document.getElementById(P.boxId);
      if (box) {
        this.io = new IntersectionObserver(es => {
          const v = es.some(e => e.isIntersecting);
          if (v === this.visible) return;
          this.visible = v;
          if (v) { this.b.dirty = true; this.rows.forEach(R => { R.dirty = true; }); this.kick(); }
          else if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; this.last = 0; }
        }, { rootMargin: "100px 0px" });
        this.io.observe(box);
      }
    }
  }

  // A canvas changed size (the embed resized, or the View as tweak): it is redrawn at once, before the browser shows it blank
  resized(es) {
    if (this.gone) return;
    es.forEach(e => {
      const T = e.target === this.b.cv ? this.b : this.rows.find(R => R.cv === e.target);
      if (!T) return;
      const dp = e.devicePixelContentBoxSize && e.devicePixelContentBoxSize[0];
      T.w = e.contentRect.width; T.h = e.contentRect.height;
      T.dw = dp ? dp.inlineSize : 0; T.dh = dp ? dp.blockSize : 0;
      T.dirty = true;
    });
    this.frame(true);
  }

  // Takes a new render's plan: every peg whose state, colour or hop changes starts its transition (after its wait in the wave), as the CSS's did
  apply(P) {
    if (this.gone || !P) return;
    this.attach(P);
    const now = performance.now();
    this.setBoard(P.board, now);
    this.setRows(P.rows, P.rowGeo, now);
    this.kick();
  }

  setBoard(Q, now) {
    const B = this.b, seats = Q.seats, instant = Q.snap || Q.reduce;
    if (B.geo !== Q.geo) { B.geo = Q.geo; B.dirty = true; }
    // each colour a peg can take, ready to draw and to mix in a fade
    if (!B.tc || B.toneKey !== Q.toneKey) {
      B.tc = {};
      Object.keys(Q.tones).forEach(k => { const t = Q.tones[k]; B.tc[k] = { c: t.c, s: t.s, k: t.k, lw: t.lw, cr: rgbOf(t.c), sr: rgbOf(t.s), kr: rgbOf(t.k) }; });
      B.toneKey = Q.toneKey; B.dirty = true;
    }
    if (B.psh !== Q.psh || B.hopk !== Q.hopk) { B.psh = Q.psh; B.hopk = Q.hopk; B.dirty = true; }
    const fresh = !B.pegs || B.pegs.length !== seats.length;
    if (fresh) B.pegs = seats.map(() => ({ q: chan(0), on: chan(0), amp: chan(0), col: { f: "", t: "", t0: 0 }, hole: { f: "", t: "", t0: 0 }, up: false, clock: 0, hd: 1, hh: 1, qv: 0, h: 0, title: "" }));
    let until = B.until, nUp = 0;
    seats.forEach((s, i) => {
      const p = B.pegs[i], loop = Q.geo.hop[i], q = s.up ? 1 : 0, amp = Q.hopping && s.up ? 1 : 0;
      if (fresh) p.clock = loop.hp;   // v12: each peg starts somewhere of its own in its hop loop
      p.hd = loop.hd; p.hh = loop.hh; p.title = s.title; p.up = s.up;
      if (s.up) nUp++;
      if (fresh || instant) {
        chanSet(p.q, q); chanSet(p.on, q); chanSet(p.amp, amp);
        p.col.f = p.col.t = s.tone; p.hole.f = p.hole.t = s.hole;
        return;
      }
      // standing up on the pop spring, sinking on the settle spring, 460ms either way; colours and hole in 120ms; the hop's switch in 250ms, all after the peg's wait in the wave
      if (chanTo(p.q, q, now, s.d, 460, s.up ? CURVE.pop : CURVE.settle)) until = Math.max(until, p.q.t0 + 460);
      if (fadeTo(p.col, s.tone, now, s.d)) until = Math.max(until, p.col.t0 + FADE);
      if (fadeTo(p.hole, s.hole, now, s.d)) until = Math.max(until, p.hole.t0 + FADE);
      if (chanTo(p.on, q, now, s.d, 250, CURVE.ease)) until = Math.max(until, p.on.t0 + 250);
      // v12 and v13: the hop swells in over 300ms once the wave crosses the dashed line (majd), and dies away over 550ms, dipping a touch, when the majority is lost
      if (amp ? chanTo(p.amp, 1, now, Q.majd, 300, CURVE.hopIn) : chanTo(p.amp, 0, now, 0, 550, CURVE.hopOut)) until = Math.max(until, p.amp.t0 + p.amp.dur);
    });
    if (fresh || instant) B.dirty = true;
    B.until = until; B.nUp = nUp; B.hopping = Q.hopping && !Q.reduce;
  }

  setRows(list, rg, now) {
    if (!rg) { this.rg = null; return; }
    if (!this.rg || this.rg.key !== rg.key) this.rows.forEach(R => { R.dirty = true; });
    this.rg = rg;
    const instant = rg.snap || rg.reduce;
    list.forEach((pr, j) => {
      const R = this.rows[j];
      if (!R) return;
      if (!pr) { if (R.dots.length) { R.dots = []; R.dirty = true; } return; }
      if (R.color !== pr.color || R.side !== pr.side || R.line !== pr.line) { R.color = pr.color; R.side = pr.side; R.line = pr.line; R.dirty = true; }
      if (R.dots.length > pr.dots.length) { R.dots.length = pr.dots.length; R.dirty = true; }
      let until = R.until;
      pr.dots.forEach((d, i) => {
        const q = d.up ? 1 : 0, o = R.dots[i];
        // a peg new to the row stands at once, as a new element did; while the intro holds the board, or for reduced motion, every change is at once
        if (!o || instant) {
          if (o) { chanSet(o.q, q); chanSet(o.op, d.op); } else R.dots[i] = { q: chan(q), op: chan(d.op) };
          R.dirty = true;
          return;
        }
        if (chanTo(o.q, q, now, d.wd, 460, d.up ? CURVE.pop : CURVE.settle)) until = Math.max(until, o.q.t0 + 460);
        if (chanTo(o.op, d.op, now, 0, 200, CURVE.ease)) until = Math.max(until, o.op.t0 + 200);
      });
      R.until = until;
    });
  }

  // The shapes a seat is drawn with, centred on 0,0 and built once for each size: its hole, a peg's oval, and the oval inside its hairline for each hairline width (rounded to a twentieth of a pixel, so a fading line reuses a few)

  constructor(props) {

    this.partsId = "e-parts-" + Math.random().toString(36).slice(2, 10);

  // v15 intro. The Intro tweak: "On view and poll switch" (the default), "On view only" or "Off".

      if (this.io) { this.io.disconnect(); this.io = null; }

    };
    let tries = 0;
    const watch = () => {
      if (this.introDone || this.gone) return;

      if (el && typeof IntersectionObserver === "function") {

    };
    watch();
  }

  // v19: while the About this poll panel is open, a click or tap anywhere but the i button or one of the panel's links closes it (the click still does whatever it was for, so a tap on a party picks it as well), and so does the reader clicking away from the embed altogether, which takes the focus off its window, unless they did that by opening one of the panel's links
  watchInfo(open) {
    if (typeof document === "undefined" || typeof window === "undefined") return;
    if (open && !this.infoAway) {
      const path = e => e.composedPath ? e.composedPath() : [e.target];
      const close = () => { if (!this.gone && this.state.info) this.setState({ info: false }); };
      this.infoLink = false;
      this.infoAway = e => {
        const eye = document.getElementById(this.eyeId), panel = document.getElementById(this.infoId), p = path(e);
        this.infoLink = !!panel && p.some(n => n && n.tagName === "A" && panel.contains(n));
        if (this.infoLink || (eye && p.indexOf(eye) >= 0)) return;

      };

        close();
      };

  // v16: once a new majority win is on the board, the hop runs for HOP.burst after the wave crosses the dashed line, then the board settles (Hop length: Short burst)
  componentDidUpdate(prevProps, prevState) {

    this.syncPegs();   // v24: the painter takes this render's pegs
    // v17: a new camera angle changes how much room a picked peg needs to stand, so the rows of pegs are picked again
    if (this.ro && this.fitHk !== this.fitHkUsed) this.fitRows();
    const w = this.wave;
    if (!w || !w.reached || this.burstFor === this.wonId || (this.props.hopLength ?? "Short burst") !== "Short burst") return;
    const id = this.burstFor = this.wonId;
    clearTimeout(this.burstTimer);

  componentWillUnmount() {

    clearTimeout(this.fitTimer);
    clearTimeout(this.pegTimer);   // v24
    if (this.io) this.io.disconnect();
    if (this.ro) this.ro.disconnect();

  renderVals() {
    const st = this.state;
    const metro = METRO;
    const poll = metro.polls.find(p => p.id === st.pollId) || metro.polls[0];
    const picked = st.picked, oth = st.oth;
    const N = metro.seats, MAJ = metro.majority;
    const go = patch => { this.stopIntro(); this.setState(Object.assign({ pollId: poll.id, demo: null }, patch)); };   // v15: any pick ends the intro
    const seatsOf = k => poll.seats[k] || 0;
    const tone = hex => this.tones[hex] || (this.tones[hex] = tonesOf(hex));

    // Poll tabs: the chosen poll is solid black; the others sit on light grey. Only the outer top corners of the first and last tab are rounded.
    const polls = metro.polls.map((p, i, all) => {
      const on = p === poll;
      return {
        name: POLLS[p.id].tab, when: POLLS[p.id].when, pressed: on ? "true" : "false",
        radius: (i === 0 ? "8px" : "0") + " " + (i === all.length - 1 ? "8px" : "0") + " 0 0",
        bg: on ? DM.black : DM.grey3, fg: on ? DM.white : DM.ink1, sub: on ? PRINT.tan : PRINT.ink2,
        cls: on ? "is-on" : "is-idle", cursor: on ? "default" : "pointer",
        // v12: switching polls keeps the picked parties (and Other, at the new poll's full share); only a suggested path is dropped
        pick: () => {
          if (on) return;
          // v25: a part of Other keeps its count (no more than this poll's Other holds), and all of Other stays all of it
          const othNow = this.state.oth, othAllNow = poll.seats.OTH || 0, othAllNew = p.seats.OTH || 0;
          const othNew = othNow <= 0 ? 0 : (othNow >= othAllNow ? othAllNew : Math.min(othNow, othAllNew));
          const keep = this.state.picked.filter(k => k !== "OTH" || othNew > 0);   // v14: Other keeps its place in the stack unless this poll has no Other seats
          const next = { pollId: p.id, picked: keep, oth: othNew, activePath: -1 };
          // v15: with nothing picked, a new poll replays the intro: its full board at once, standing still, then the drain; with parties picked they carry over as before and nothing replays
          if (!keep.length && !othNew && this.introMode() === "On view and poll switch" && !reducedMotion()) return this.playIntro(next);
          this.stopIntro();
          this.setState(Object.assign(next, { demo: null }));
        }
      };
    });

    // About this poll: the i toggles the panel, which shows the chosen poll; v19: a click or tap anywhere but the i or one of the panel's links closes it (watchInfo)
    const infoOpen = !!st.info;
    const I = POLL_INFO[poll.id];
    const info = { title: I.title, body: I.body, url: I.url, linkText: I.link, facts: I.facts.map(f => ({ k: f[0], v: f[1] })) };

    // Suggested paths. Labels are kept short so each fits on one line in a phone-width row.
    const pathLabel = pt => {
      let s = pt.p.map(k => PARTIES[k].name).join(" + ");
      if (pt.p.length === 1 && !pt.o) s += " alone";
      if (pt.o) s += pt.o === poll.seats.OTH ? " + Other" : " + " + pt.o + " of Other";
      return s;
    };
    const paths = poll.paths.map((pt, i) => {
      const on = i === st.activePath;
      const label = pathLabel(pt);
      const total = pt.p.reduce((a, k) => a + seatsOf(k), 0) + pt.o;
      return {
        label: label, seatsText: String(total), aria: label + ": " + total + " seats",
        pressed: on ? "true" : "false", cls: on ? "path is-on" : "path",
        bg: on ? DM.panel : DM.white, fg: on ? DM.white : DM.ink1, border: on ? DM.panel : DM.grey2,
        pick: () => go({ picked: pt.p.concat(pt.o ? ["OTH"] : []), oth: pt.o, activePath: i })
