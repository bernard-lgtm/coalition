    });

    // The camera looks down at the board at cameraAngle (90 = straight down; the default 80 is just off it). tilt is how far that is from straight down:
    // the board squashes front to back by cos(tilt) and peg heights stand up the screen by sin(tilt).
    // Everything on the chart is measured in the half circle's 1000-wide units; 1 unit = 0.1cqw of the chart.
    const tilt = (90 - num(this.props.cameraAngle, 80, 15, 90)) * Math.PI / 180;
    const hScale = num(this.props.pegHeight, 1, 0.3, 2.5);
    // v12: the majority hop's height, as a multiple of a picked peg's height (0 turns it off), and its speed
    const hopH = num(this.props.hopHeight, 1.5, 0, 3), hopV = num(this.props.hopSpeed, 1, 0.25, 3);
    const hopDur = i => HOP.tempo * (1 + HOP.spread * (2 * rnd(i, 2) - 1)) / hopV;
    // v13: a sweep round the whole half circle takes waveT ms (the Wave time tweak; 0 = everything at once), and the party rows move at the same pace per seat
    const waveT = num(this.props.waveTime, 600, 0, 3000), perSeat = waveT / N;
    // v14: the sweep is eased (the Wave ease tweak). easeAt(f) is how far into its time a sweep is when it has gone f of its way along.
    const ease = WAVE_EASE[this.props.waveEase] || WAVE_EASE["Smooth start and end"];
    const easeAt = f => easeTime(ease, f);
    const ms = v => Math.round(v) + "ms";
    const sq = Math.cos(tilt), hk = Math.sin(tilt);
    this.fitHk = hk;   // v17: the party rows' fit needs it to know how much room a picked peg takes standing up
    if (!this.layouts[N]) this.layouts[N] = seatLayout(N);
    const lay = this.layouts[N];
    const r = lay.r;
    const up = PEG.up * hScale;
    const TOP = up * hk * 1.18 + r * sq + 5;   // headroom above the board for the tallest pegs along the far edge, spring overshoot included
    const SH = TOP + 530 * sq;                 // the chart's height
    const cq = v => (v / 10).toFixed(3) + "cqw";
    // v18: the sun's height above the board (the Sun angle tweak; 90 is straight overhead) sets how far a shadow falls for each unit of a peg's height
    const shf = 1 / Math.tan(num(this.props.sunAngle, 75, 30, 89) * Math.PI / 180);
    // v24: the board's measures for its canvas (boardGeo), worked out once for each set of tweaks, as v16's peg places were
    const geoKey = [N, tilt, hScale, hopV, hopH, shf].join("|");
    if (!this.geo || this.geo.key !== geoKey) this.geo = boardGeo(lay, { key: geoKey, TOP: TOP, SH: SH, sq: sq, hk: hk, up: up, shf: shf, hopH: hopH, hopDur: hopDur });
    const geo = this.geo;
    const stage = {
      w: "min(100cqw, calc((100cqh - 40px) * " + (1000 / SH).toFixed(4) + "))",
      // v24: the half circle's box is centred in the chart (below the flag's 40px band) by its own left, top and height rather than v21's translate(-50%, -50%), which could leave it between screen pixels and blur the canvas drawn in it
      h: "calc(min(100cqw, calc((100cqh - 40px) * " + (1000 / SH).toFixed(4) + ")) * " + (SH / 1000).toFixed(5) + ")",
      left: "calc(50cqw - min(100cqw, calc((100cqh - 40px) * " + (1000 / SH).toFixed(4) + ")) / 2)",
      top: "calc(50cqh + 20px - min(100cqw, calc((100cqh - 40px) * " + (1000 / SH).toFixed(4) + ")) * " + (SH / 2000).toFixed(5) + ")",
      // v17: the chart's height for each px of the box's width, so the chart can be exactly as tall as the half circle drawn at full width (plus the flag's 40px band)
      k: (SH / 1000).toFixed(4),
      stick: cq(TOP + 2.1 * sq), boardTop: cq(TOP), sq: sq.toFixed(4), hk: hk.toFixed(4),
      // the dashed line stops short of the tally, which stands on the board's front edge
      lineH: cq(Math.max(0, 495 - 75 / sq - 2.1)),
      tallyBottom: ((SH - TOP - 495 * sq) / SH * 100).toFixed(2) + "%",
      // v24: the canvas the pegs are drawn on: the chart's box, reaching out past it on every side as far as boardGeo says
      cvL: cq(-geo.ml), cvT: cq(-geo.mt), cvW: cq(geo.W), cvH: cq(geo.H)

    // Pegs: all near-white and sunk just below the board until something is picked; then the coalition pops up in party colours (filling the half circle from the left end, in the order its parties were picked from v14) and every other peg stays sunk and near-white.
    const any = picked.length > 0 || oth > 0;
    // v15: while the intro holds the full board (demo "hold") the board stacks every party from the left end in the order of the party rows (largest first, then Other), as though they had all been picked from the top down; demoStart is where each party's seats begin in that stack, which its row keeps time with when the board drains
    const demo = st.demo, demoOn = demo === "hold";
    const ranked = metro.order.filter(k => k !== "OTH" && poll.seats[k] != null).sort((a, b) => poll.seats[b] - poll.seats[a]);
    const makeupOrder = ranked.concat(metro.order.filter(k => k === "OTH"), metro.order.filter(k => k !== "OTH" && poll.seats[k] == null));
    const demoStart = {}, demoSeq = [];
    makeupOrder.forEach(k => { const n = poll.seats[k] || 0; demoStart[k] = demoSeq.length; for (let i = 0; i < n; i++) demoSeq.push([k, true]); });
    // v14: the coalition stacks on the board in the order its parties were picked (Other wherever it was picked), so each new pick fills the open seats after the coalition already standing
    const seq = demoOn ? demoSeq : [];
    if (!demoOn) {
      const stack = picked.includes("OTH") || oth === 0 ? picked : picked.concat("OTH");
      stack.forEach(k => { const n = k === "OTH" ? oth : seatsOf(k); for (let i = 0; i < n; i++) seq.push([k, true]); });
      metro.order.forEach(k => {
        if (k !== "OTH" && picked.includes(k)) return;
        const n = k === "OTH" ? poll.seats.OTH - oth : seatsOf(k);
        for (let i = 0; i < n; i++) seq.push([k, false]);
      });
    }
    // v24: the colours a peg can take, each named by its colours and line (the Outlines tweak: each colour's deep shade, black ink, or no lines; empty pegs keep a pale line with ink), so the painter can make its pictures of them once
    const lines = this.props.outlines ?? "Colour";
    const tones = {};
    const toneKey = (c, s, k, w) => { const key = c + "|" + s + "|" + k + "|" + w; tones[key] = { c: c, s: s, k: k, lw: w }; return key; };
    const litKey = hex => { const t = tone(hex); return toneKey(t.c, t.s, lines === "Ink" ? DM.black : t.k, lines === "None" ? 0 : 0.35); };
    const emptyKey = toneKey(EMPTY_TONES.c, EMPTY_TONES.s, lines === "Ink" ? "#dddddd" : EMPTY_TONES.k, lines === "None" ? 0 : 0.3);
    metro.order.forEach(k => { litKey(PARTIES[k].color); });
    const seats = lay.fill.map((p, i) => {
      const k = seq[i] ? seq[i][0] : "OTH";
      const lit = (any || demoOn) && (seq[i] ? seq[i][1] : false);
      return { up: lit, color: lit ? PARTIES[k].color : "", tone: lit ? litKey(PARTIES[k].color) : emptyKey, hole: lit ? "dark" : "pale", title: PARTIES[k].name + ": " + poll.seats[k] + " seats", d: 0 };
    });
    // v13 wave. Against the board last drawn, find every peg that changes (it rises, sinks or changes colour). When the coalition grows, or keeps its size, they change
    // in a sweep that runs clockwise from the first of them; when it shrinks, counter-clockwise from the last of them, so pegs leave in the opposite order to the one they
    // came in. Each changing peg waits until the sweep reaches its angle (plus a few ms of scatter); every other peg waits 0ms. The sweep is worked out once for each new
    // board, so a redraw that changes nothing on it (a tweak, say) keeps it. majd is when the sweep crosses the dashed line, if this change wins or loses the majority.
    const tally = picked.reduce((s, k) => s + (k === "OTH" ? 0 : seatsOf(k)), 0) + oth;   // v14: "OTH" in picked only marks Other's place in the stack; its seats are oth
    // v15: the board's own count (every seat while the intro shows them all) sets which way a wave runs; the Majority flag only ever counts the parties picked
    const boardN = demoOn ? N : tally;
    const reached = !demoOn && tally >= MAJ;
    const keys = seats.map(s => s.color);
    const sig = keys.join(",");
    if (!this.wave || this.wave.sig !== sig) {
      const was = this.wave, wd = keys.map(() => 0);
      let majd = 0;
      if (was && was.keys.length === keys.length) {
        const ch = [];
        keys.forEach((k, i) => { if (k !== was.keys[i]) ch.push(i); });
        if (ch.length) {
          // a board that shrinks (v15: the intro's drain included) sweeps back counter-clockwise, from the last peg that changes to the first
          const back = boardN < was.tally;
          const a0 = lay.fill[back ? ch[ch.length - 1] : ch[0]].a, a1 = lay.fill[back ? ch[0] : ch[ch.length - 1]].a;
          // v14: the sweep across the changing pegs takes as long as v13's even one across the same arc, but eased along the way
          const span = Math.abs(a1 - a0) || 1, sweepT = span / Math.PI * waveT;
          ch.forEach(i => { wd[i] = easeAt(Math.abs(lay.fill[i].a - a0) / span) * sweepT + rnd(i, 5) * PEG.jitter; });

        }
      }

    }
    seats.forEach((s, i) => { s.d = this.wave.wd[i]; });

    // The Majority flag shows only while the parties picked (and any seats taken from Other) hold a majority: reached, worked out with the wave above (v15: never while the intro plays). Below it the flag hides in place, so nothing on the page moves.

    // Party rows, most projected seats first, one peg per projected seat. Each row toggles that party in or out of a custom coalition.
    // Tapping a party while a path is selected drops the path and starts a fresh selection with that party.
    // "Other" toggles all of its seats at once (paths can still take part of it). Parties outside the coalition fade and their pegs sink flush.
    // "Other" sits after the ranked parties, followed by any party this poll did not report separately.
    const inPath = st.activePath >= 0;
    const fadeOp = inPath ? "0.3" : "0.45";
    // v14: picked keeps the order the parties were picked in, with "OTH" marking Other's place, so a new pick always goes on the end of the stack
    const pickParty = k => {
      const othAll = poll.seats.OTH || 0;
      if (inPath) return go(k === "OTH" ? { picked: othAll ? ["OTH"] : [], oth: othAll, activePath: -1 } : { picked: [k], oth: 0, activePath: -1 });
      const rest = picked.filter(x => x !== k);
      if (k === "OTH") return go(oth > 0 ? { picked: rest, oth: 0, activePath: -1 } : { picked: othAll ? rest.concat("OTH") : rest, oth: othAll, activePath: -1 });
      go({ picked: picked.includes(k) ? rest : picked.concat(k), activePath: -1 });
    };
    // (ranked and makeupOrder are worked out with the board above, since v15's intro stacks the board in the rows' order)
    // v24: each row's pegs go to the painter (rowPlans), drawn on the row's own canvas; until the rows are measured, a row is laid out for 4 rows of pegs
    const fitR = st.fit ? st.fit.rows : 4;
    const rowPlans = [];
    const makeup = makeupOrder.map((k, j) => {
      const n = poll.seats[k], name = PARTIES[k].name, color = PARTIES[k].color;
      // v19: a party's mark is its initials (or its name, for a party without any, and for Other); tw is the label's width in ems, so one too long for its column can draw smaller to fit
      // v20: at the Label weight tweak's weight; tn is the label's letter count less one, for the letter-spacing between its letters
      const tw = labelEm(name, num(this.props.labelWeight, 400, 100, 900)).toFixed(4), tn = String(Math.max(0, name.length - 1));
      if (n == null) {
        rowPlans.push(null);
        return {
          name: name, color: color, note: "Not reported; counted in Other", clickable: false, nr: true, op: any ? fadeOp : "1",
          tw: tw, tn: tn, nameFg: PRINT.muted,
          aria: name + ": not reported separately in this poll, so its support is counted in Other",
          title: "Not reported separately in this poll, so its support is counted in Other"
        };
      }
      const inN = k === "OTH" ? oth : (picked.includes(k) ? n : 0);
      const on = inN > 0;
      const lit = on || demoOn;   // v15: the intro lights every row as though picked (aria-pressed still says what is really picked)
      const out = any && !on;
      const partial = !demoOn && k === "OTH" && on && inN < n;
      const dots = []; /* when a path takes only part of Other, the pegs it leaves out sink and fade */
      // v13: a rising peg waits one step per seat counted from the left end of its row, a sinking one one step per seat counted from the right end
      // v14: the row's sweep takes as long as before but runs on the same ease as the half circle's
      // v15: while the intro runs, each peg instead keeps time with the seat it stands for in the intro's stack on the half circle, so a row drains from its right just as the wave crosses its party's seats; first is when the wave first reaches them
      const rowT = Math.max(0, n - 1) * perSeat;
      let first = Infinity;
      for (let i = 0; i < n; i++) {
        const left = partial && i >= inN, upD = lit && !left, w = demo ? this.wave.wd[demoStart[k] + i] || 0 : 0;
        if (w < first) first = w;
        dots.push({ up: upD, op: left ? 0.3 : 1, wd: demo ? w : rowT * easeAt((upD ? i : n - 1 - i) / Math.max(1, n - 1)) });
      }
      const t = tone(color), cvId = this.partsId + "-cv" + j;
      rowPlans.push({ cvId: cvId, color: color, side: t.s, line: lines === "None" ? null : (lines === "Ink" ? DM.black : t.k), dots: dots });
      // v25: Other's row has the minus and plus: its count is the seats in the coalition over Other's total (every seat while the intro shows them all), and each button greys out at its end
      const isOth = k === "OTH", shown = demoOn ? n : inN;
      return {
        name: name, color: color, label: isOth ? String(shown) : String(n), of: isOth ? "/" + n : "", clickable: !isOth, nr: false, step: isOth,
        lessCls: inN > 0 ? "" : "is-off", moreCls: inN < n ? "" : "is-off", lessOff: inN > 0 ? "false" : "true", moreOff: inN < n ? "false" : "true",
        lessAria: "Take one of Other’s seats out of the coalition (" + inN + " of " + n + " in)", moreAria: "Add one of Other’s seats to the coalition (" + inN + " of " + n + " in)",
        lessDown: e => this.pressStep(e, -1), moreDown: e => this.pressStep(e, 1), lessClick: e => this.clickStep(e, -1), moreClick: e => this.clickStep(e, 1), stopHold: this.stopHold,
        tw: tw, tn: tn,
        op: out ? fadeOp : "1", pressed: on ? "true" : "false",
        // v19: picked, a party's label turned into a white button that lifts off the page with a drop shadow; v20: the white button is the hover state, and picked, the button is black with white letters (in the intro every lit label starts that way)
        // v15: in the intro every mark starts lifted, and drops flat as the drain's wave first reaches its party's seats (pd)
        markCls: lit ? "is-on" : "", nameFg: lit ? DM.white : DM.ink1,
        pd: ms(demo && n > 0 ? first : 0),
        // v24 revised: is-picked marks a party really in the coalition (not just lit by the intro), so its seat count can turn into an X under a mouse pointer
        cls: (out ? "chip is-faded" : "chip") + (on ? " is-picked" : ""),
        pick: () => pickParty(k),
        aria: name + ": " + n + " projected seats" + (partial ? ", " + inN + " of them in this coalition" : ""),
        // v24: the row's canvas, and how many columns of pegs the party takes, so its bar is as long as its share
        cvId: cvId, pcols: String(Math.ceil(n / fitR))

    });

    // v16: the hop runs while the majority holds (Hop length: While it holds), or only for its burst (Short burst)
    const hopping = reached && hopH > 0 && !((this.props.hopLength ?? "Short burst") === "Short burst" && st.calm === this.wonId);
    // v18: the Shadow tweak under Pegs (how dark the pegs' shadows are)
    const pegShade = num(this.props.pegShadow, 1, 0, 3);
    const reduce = reducedMotion();
